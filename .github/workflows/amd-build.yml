name: Rebuild AMD

# When a branch changes a plugin's JavaScript source (amd/src), GitHub rebuilds amd/build with Moodle 5.3's
# grunt (scripts/dev/build-amd.sh) and commits it to that branch, so nobody needs the build tools locally.
# Commits made with GITHUB_TOKEN do not start other workflows, so this one then starts CI and the secrets
# scan on the new commit; their results show on the pull request as usual.
on:
  push:
    branches-ignore: [main]
    paths: ["plugins/**/amd/src/**"]
  workflow_dispatch:      # "Run workflow" button: rebuild every plugin on the chosen branch.

concurrency:
  group: amd-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache Node 22 and Moodle's grunt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/hikmah-moodle-grunt
          key: hikmah-moodle-grunt-${{ hashFiles('scripts/dev/build-amd.sh') }}

      - name: Rebuild amd/build
        run: |
          plugins=$(find plugins -type d -path '*/amd/src' -not -path '*/node_modules/*' | sed 's#/amd/src$##' | sort)
          scripts/dev/build-amd.sh $plugins

      - name: Commit and start the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- ':(glob)plugins/**/amd/build/**'
          if git diff --cached --quiet; then
            echo "amd/build already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild amd/build (automatic, Moodle 5.3 grunt)"
          git push
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run secrets.yml --ref "${GITHUB_REF_NAME}"
