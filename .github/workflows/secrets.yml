name: Secrets scan

on:
  push:
    branches: [main]   # branch work is scanned once, by its pull request
  pull_request:
  workflow_dispatch:   # Started by amd-build.yml after it commits rebuilt JavaScript.

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
